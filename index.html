<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluación de Suficiencia Técnica SGI</title>
    <style>
        /* ESTILOS GENERALES DE LA APLICACIÓN */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a; 
            color: #f1f5f9; 
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 850px;
            width: 100%;
            background: #1e293b; 
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border: 1px solid #334155;
            box-sizing: border-box;
        }
        
        h1 {
            text-align: center;
            color: #38bdf8; 
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
        }
        
        .screen { display: none; }
        .active { display: block; }
        
        /* PANTALLA REGISTRO */
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 15px; color: #94a3b8; font-weight: bold; }
        input {
            width: 100%; padding: 14px; background: #0f172a; border: 1px solid #475569;
            color: white; border-radius: 8px; font-size: 16px; box-sizing: border-box;
        }
        .btn-start {
            width: 100%; background: #38bdf8; color: #0f172a; border: none; padding: 16px;
            font-size: 17px; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase;
        }
        
        /* PANTALLA JUEGO (QUIZ) */
        .progress-bar {
            background: #0f172a; padding: 8px 15px; border-radius: 20px;
            font-size: 13px; font-weight: bold; color: #38bdf8; display: inline-block; margin-bottom: 20px;
        }
        .question-text { font-size: 19px; font-weight: bold; line-height: 1.5; color: white; margin-bottom: 25px; }
        .option-btn {
            display: block; width: 100%; background: #334155; color: #f1f5f9; border: 1px solid #475569;
            padding: 16px; margin-bottom: 12px; border-radius: 8px; text-align: left; font-size: 15.5px; cursor: pointer;
        }
        .option-btn:hover { background: #475569; }
        
        /* RETROALIMENTACIÓN TÉCNICA REQUERIDA */
        .feedback { padding: 15px; border-radius: 8px; margin-top: 20px; display: none; font-size: 15px; line-height: 1.5; }
        .correct { background: #064e3b; border-left: 5px solid #10b981; color: #a7f3d0; }
        .wrong { background: #7f1d1d; border-left: 5px solid #ef4444; color: #fca5a5; }
        
        .btn-next {
            display: none; background: #2563eb; color: white; border: none; padding: 12px 30px;
            font-size: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; margin: 20px 0 0 auto; text-transform: uppercase;
        }

        /* PANTALLA DE RESULTADOS */
        .result-title { font-size: 24px; font-weight: bold; color: #ecc94b; text-align: center; margin-bottom: 15px; }
        
        /* EL CERTIFICADO REFINADO (FONDO BLANCO, TEXTOS AZULES #1E3A8A) */
        .cert-frame {
            background: #ffffff;
            color: #1e3a8a; /* Todo el texto en azul corporativo solicitado */
            padding: 40px 40px 40px 180px; /* Margen izquierdo amplio para que no tape la franja */
            border: 2px solid #1e3a8a;
            border-radius: 4px;
            text-align: center;
            margin-top: 20px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            box-sizing: border-box;
            overflow: hidden;
        }
        
        /* FRANJA DIAGONAL IZQUIERDA AL OTRO LADO (INSPIRADO EN TU DISEÑO) */
        .cert-frame::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 140px; height: 100%;
            background: linear-gradient(135deg, #1e3a8a 0%, #1e3a8a 70%, #ecc94b 70%, #ecc94b 75%, transparent 75%);
            z-index: 1;
        }
        
        .cert-content { position: relative; z-index: 2; width: 100%; }
        
        .cert-logo-box { max-width: 140px; margin: 0 auto 15px auto; text-align: center; }
        .cert-logo-box img { max-width: 100%; height: auto; }
        .logo-placeholder { font-size: 11px; color: #94a3b8; font-style: italic; }
